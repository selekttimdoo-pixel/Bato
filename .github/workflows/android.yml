name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-permissions.txt
          grep -F "android.permission.INTERNET" /tmp/apk-permissions.txt
          grep -F "android.permission.RECORD_AUDIO" /tmp/apk-permissions.txt

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator live bridge test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViplaBatoIndependent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-roman-voice
          name: VIPLA BATO Android v0.4.1-roman-voice
          body: Semantic continuity, grounded STENO/Riznica/FAST GRAPH retrieval, Serbian normalization, and provider-neutral BATO voice adapter.
          files: app/build/outputs/apk/debug/app-debug.apk
