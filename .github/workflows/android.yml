name: Build Android APK


on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_after_physical_voice_qa:
        description: 'Publish only after Dragan accepts the Serbian voice samples'
        required: true
        default: false
        type: boolean


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug


      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
